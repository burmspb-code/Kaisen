[tool.poetry]
name = "config"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.14"
django = "^6.1"
djangorestframework = "^3.18.0"
django-cors-headers = "^4.9.0"
python-dotenv = "^1.2.3"
psycopg2-binary = "^2.9.12"
celery = "^5.6.3"
redis = "^8.1.0"
pillow = "^12.3.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.16.4,<0.17.0)",
    "mypy (>=2.3.1,<3.0.0)"
]

[tool.ruff]
# Базовые проверки (E, F), сортировка импортов (I) и современный синтаксис (UP)
select = ["E", "F", "I", "W", "UP"]
ignore = []
line-length = 88

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"  # Укажите вашу версию Python (например, 3.10, 3.11, 3.12)
strict = true
ignore_missing_imports = true
