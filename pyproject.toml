[tool.poetry]
name = "config"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.14"
django = "^6.1"
djangorestframework = "^3.18.0"
django-cors-headers = "^4.9.0"
python-dotenv = "^1.2.3"
psycopg2-binary = "^2.9.12"
celery = "^5.6.3"
redis = "^8.1.0"
pillow = "^12.3.0"
drf-spectacular = "^0.30.0"
drf-spectacular-sidecar = "^2026.8.1"
django-stubs = "^6.1.0"
djangorestframework-stubs = "^3.18.1"
requests = "^2.34.2"
coverage = "^7.16.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.16.4,<0.17.0)",
    "mypy (>=2.3.1,<3.0.0)"
]

[tool.mypy]
python_version = "3.14"  # Укажите вашу версию Python (например, 3.10, 3.11, 3.12)
strict = true
ignore_missing_imports = true

[tool.ruff]
# Минимально необходимая версия Ruff (хорошая практика для фиксации окружения)
required-version = ">=0.5.0"

# Список исключений: папки окружения, миграции и ваш settings.py
exclude = [
    ".git",
    ".venv",
    "venv",
    "env",
    "__pycache__",
    "**/migrations/*.py",
    # Укажите точный путь к вашему settings.py от корня проекта:
    "config/settings.py",
]
line-length = 120
# Настройки линтера (анализатора кода)
[tool.ruff.lint]
# Стандартный набор правил для профессионального Django-проекта
select = [
    "E",   # Ошибки стиля кода (pycodestyle errors)
    "W",   # Предупреждения стиля кода (pycodestyle warnings)
    "F",   # Логические ошибки и дефекты (Pyflakes)
    "I",   # Автоматическая сортировка импортов (замена isort)
    "S",   # Проверка безопасности (Bandit) — найдет жестко зашитые пароли
    "B",   # Поиск потенциальных багов и подводных камней (flake8-bugbear)
    "DJ",  # Специфичные правила для Django (flake8-django)
    "RUF", # Собственные полезные правила разработчиков Ruff
]

# Правила, которые мы сознательно отключаем (если нужно)
ignore = [
        "S101",   # Разрешаем использовать assert в тестах
        "RUF001", # Игнорировать русскую раскладку в самом коде
        "RUF002", # Игнорировать русскую раскладку в докстрингах
        "RUF003", # Игнорировать русскую раскладку в комментариях (#)
]

[tool.ruff.format]
quote-style = "double"

# Настройки для автоматической сортировки импортов (секция I)
[tool.ruff.lint.isort]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
# Укажите через запятую имена всех ваших Django-приложений в проекте:
known-first-party = ["routines", "users"]