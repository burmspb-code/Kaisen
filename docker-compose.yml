services:
  db:
    image: postgres:16-alpine
    container_name: kaisen_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432" # Пробрасываем порт из .env наружу
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: kaisen_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
